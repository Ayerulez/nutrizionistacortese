<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina non trovata – Dott.ssa Giulia Cortese</title>
  <meta name="robots" content="noindex,follow" />
  <link rel="icon" type="image/png" href="/images/favicon-32.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <meta name="theme-color" content="#5a8260" />
  <style>
    body{min-height:100dvh;display:grid;place-items:center;background:#faf7f2;color:#253b2a;padding:24px;font-family:Arial,sans-serif}
    .not-found{max-width:640px;text-align:center;padding:48px 32px;background:#fff;border:1px solid #e1e7dd;border-radius:20px}
    .not-found img{width:148px;height:148px;object-fit:contain;margin:0 auto 24px}
    .not-found small{display:block;font-size:12px;letter-spacing:.15em;color:#5a8260;margin-bottom:16px}
    .not-found h1{font-size:clamp(28px,5vw,40px);line-height:1.2;margin-bottom:18px}
    .not-found p{font-size:16px;line-height:1.7;color:#627060;margin-bottom:26px}
    .not-found nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    .not-found a{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:8px;background:#456b50;color:white;text-decoration:none;font-weight:600}
    .not-found a.secondary{background:#eef3e9;color:#34543e}
    .not-found a:focus-visible{outline:3px solid #d4a853;outline-offset:4px}
    @media(max-width:480px){.not-found{padding:32px 20px}.not-found nav{flex-direction:column}}
  </style>
</head>
<body>
  <main class="not-found">
    <a href="/" aria-label="Home Studio Cortese" style="background:transparent;padding:0"><img src="/images/logo.png" alt="Dott.ssa Giulia Cortese – Biologa Nutrizionista" /></a>
    <small>ERRORE 404</small>
    <h1>Questa pagina non è disponibile</h1>
    <p>L’indirizzo potrebbe essere cambiato o contenere un errore. Puoi tornare alla home oppure aprire la pagina Contatti.</p>
    <nav aria-label="Continua la navigazione"><a href="/">Torna alla home</a><a class="secondary" href="/contatti">Contatti e prenotazioni</a></nav>
  </main>
</body>
</html>
